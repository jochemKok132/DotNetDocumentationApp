name: Build & publish Docker image

# Fires only when a GitHub Release is published, so the image on the
# registry always corresponds to a tagged, intentional version.
on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets this workflow push to GHCR with the built-in token

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is provided automatically by Actions — no secret to create,
          # nothing to rotate, and it never leaves GitHub's own infrastructure.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (GHCR requires lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
            ${{ steps.image.outputs.name }}:latest

# No SSH, no server secrets, no inbound connection to the server at all.
# The server side pulls instead of being pushed to — see Watchtower in
# "Versioned Releases & Auto-Deploy".
